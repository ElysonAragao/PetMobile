name: Keep Supabase Alive

on:
  schedule:
    # Executa a cada 2 dias às 03:00 UTC (3 execuções dentro da janela de 7 dias do Supabase)
    - cron: '0 3 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase PostgreSQL via Vercel & Direct REST
        run: |
          TIMESTAMP=$(date +%s)

          echo "1) Acionando endpoint /api/cron/keep-alive na Vercel (usa SUPABASE_SERVICE_ROLE_KEY)..."
          VERCEL_RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "https://pet-mobile.vercel.app/api/cron/keep-alive?_t=$TIMESTAMP" \
            -H "Cache-Control: no-cache")
          VERCEL_STATUS=$(echo "$VERCEL_RESPONSE" | tail -n1)
          VERCEL_BODY=$(echo "$VERCEL_RESPONSE" | sed '$d')
          echo "Vercel Keep-Alive Status: $VERCEL_STATUS"
          echo "Vercel Keep-Alive Body: $VERCEL_BODY"

          echo "2) Consultando tabela pet_especies diretamente no Supabase (retorna registros reais mesmo com ANON_KEY)..."
          REST_RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/pet_especies?select=id&limit=1&_t=$TIMESTAMP" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Cache-Control: no-cache")
          REST_STATUS=$(echo "$REST_RESPONSE" | tail -n1)
          REST_BODY=$(echo "$REST_RESPONSE" | sed '$d')
          echo "Supabase REST Status (pet_especies): $REST_STATUS"
          echo "Supabase REST Body (pet_especies): $REST_BODY"

          echo "3) Executando funcao RPC is_master diretamente no PostgreSQL..."
          RPC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/is_master" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Supabase RPC Status (is_master): $RPC_STATUS"

          # Valida se pelo menos a consulta direta retornou HTTP 200 E dados reais (nao array vazio [])
          if [ "$REST_STATUS" -ne 200 ] || [ "$REST_BODY" = "[]" ] || [ -z "$REST_BODY" ]; then
            echo "Alerta: pet_especies nao retornou linhas reais ($REST_STATUS / $REST_BODY). Verificando Vercel..."
            if [ "$VERCEL_STATUS" -ne 200 ]; then
              echo "Erro critico: Falha tanto no REST direto quanto no endpoint da Vercel!"
              exit 1
            fi
          fi

          echo "Sucesso: leitura real de dados e execucao RPC registradas no PostgreSQL do Supabase!"
