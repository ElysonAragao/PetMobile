name: Keep Supabase Alive

on:
  schedule:
    # Roda às 00:00 (UTC) a cada 4 dias
    - cron: '0 0 */4 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          TIMESTAMP=$(date +%s)
          curl -f -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/pet_pets?select=id&limit=1&_t=$TIMESTAMP" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
